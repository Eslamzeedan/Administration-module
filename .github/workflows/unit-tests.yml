name: Local validation
on: [push, pull_request]
jobs:
  validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/frontend/*.test.cjs
      - run: python -m compileall -q eup_administration tools
      - run: find eup_administration -name '*.js' -exec node --check {} \;
      - run: bash -n tools/run_v3_staging_acceptance.sh
      - run: bash -n tools/run_v4_staging_acceptance.sh
      - run: bash -n tools/update_ui_staging.sh
      - run: bash -n tools/update_v4_staging_fixes.sh
      - run: bash -n tools/restore_v4_acceptance_clone.sh
      - run: bash -n tools/resume_v4_acceptance_clone.sh
